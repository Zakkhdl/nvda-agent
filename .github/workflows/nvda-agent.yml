name: Agent swing

on:
  # Chaque soir de semaine après la clôture de Wall Street.
  # 21h37 UTC = 22h37 Paris en hiver (16h37 New York), 23h37 Paris en été (17h37 New York).
  # Le second horaire rattrape un éventuel échec du premier. L'agent ne traite jamais deux fois la même séance.
  schedule:
    - cron: "37 21 * * 1-5"
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = notification de test, apercu = analyse sans rien envoyer, backtest = mesure sur 20 ans, normal = passage du soir"
        type: choice
        default: test
        options: [test, apercu, backtest, normal]

permissions:
  contents: read

concurrency:
  group: agent-swing
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer la mémoire de l'agent
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: swing-state-${{ github.run_id }}
          restore-keys: swing-state-

      - name: Lancer l'agent
        env:
          MODE: ${{ inputs.mode }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VALEURS: ${{ vars.VALEURS }}
          CAPITAL_EUR: ${{ vars.CAPITAL_EUR }}
          RISQUE_PCT: ${{ vars.RISQUE_PCT }}
          MAX_POSITIONS: ${{ vars.MAX_POSITIONS }}
          SEUIL_SCORE: ${{ vars.SEUIL_SCORE }}
          FRAIS_PCT: ${{ vars.FRAIS_PCT }}
          DUREE_MAX: ${{ vars.DUREE_MAX }}
          OBJECTIF_R: ${{ vars.OBJECTIF_R }}
        run: |
          case "$MODE" in
            test)     python -m nvda_agent --test ;;
            apercu)   python -m nvda_agent --force --dry-run ;;
            backtest) python -m nvda_agent --backtest ;;
            *)        python -m nvda_agent ;;
          esac

      - name: Sauvegarder la mémoire de l'agent
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: swing-state-${{ github.run_id }}
