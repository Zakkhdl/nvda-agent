name: Agent NVDA

on:
  # Toutes les 5 min du lundi au vendredi, de 14h à 22h55 heure de Paris (13h-21h UTC).
  # L'agent choisit lui-même quoi faire selon l'heure de New York (heure d'été et d'hiver gérées).
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = notification de test, force = analyse immédiate, backtest = mesure sur 60 séances"
        type: choice
        default: test
        options: [test, force, backtest, normal]

permissions:
  contents: read

concurrency:
  group: nvda-agent
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer la mémoire de l'agent
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: nvda-state-${{ github.run_id }}
          restore-keys: nvda-state-

      - name: Lancer l'agent
        env:
          MODE: ${{ inputs.mode }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          CAPITAL_EUR: ${{ vars.CAPITAL_EUR }}
          RISQUE_PCT: ${{ vars.RISQUE_PCT }}
          SEUIL_SCORE: ${{ vars.SEUIL_SCORE }}
          MAX_SIGNAUX_JOUR: ${{ vars.MAX_SIGNAUX_JOUR }}
          STOP_MIN_ATR: ${{ vars.STOP_MIN_ATR }}
          FRAIS_PCT: ${{ vars.FRAIS_PCT }}
          SEUIL_MOUVEMENT: ${{ vars.SEUIL_MOUVEMENT }}
        run: |
          case "$MODE" in
            test)     python -m nvda_agent --test ;;
            force)    python -m nvda_agent --force ;;
            backtest) python -m nvda_agent --backtest ;;
            *)        python -m nvda_agent ;;
          esac

      - name: Sauvegarder la mémoire de l'agent
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: nvda-state-${{ github.run_id }}
